name: CI

# Runs on every push and pull request - unlike release.yml (tag-push
# only, produces the actual shipped .EFI/.iso assets), this is the
# continuous correctness gate: does the test suite pass, does the real
# Linux kernel unpack the encrypted-root kexec handoff's own
# concatenated initramfs the way it's supposed to, and does build.sh
# itself still succeed (including its own build-time assumption checks
# - see build.sh's "verify the encrypted-root kexec handoff's own
# assumptions" block) against a real Alpine container. All three catch
# a different class of regression; none of them subsumes the others.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go-tests:
    # cmd/tool + the repo-root zfscompat package (Go, not shell) - nothing
    # else in this file exercises `go vet`/`go test` at all; build-x86_64/
    # build-aarch64 only `go build` the tool as an input to build.sh, they
    # never vet or test it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # CGO_ENABLED=0 explicitly, not just relying on the runner's own
      # default: release.yml's real shipped binaries are built this way
      # (a static binary is part of this project's own boot/rescue
      # self-containment contract - see cmd/tool/zfsnative.go's own header
      # comment), so this job must build/vet/test under the SAME setting,
      # not a possibly-different ambient default - otherwise a future
      # dependency could pass here under an implicit cgo default and only
      # fail once it reaches an actual release cross-build.
      - run: CGO_ENABLED=0 go build ./...
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go test ./...

  unit-tests:
    # tests/run-tests.sh's own header comment: runs directly on the dev
    # host, no Alpine container, no real hardware - ubuntu-latest's own
    # bash/python3 are enough.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run tests/run-tests.sh
        run: ./tests/run-tests.sh

  kernel-integration-test:
    # tests/kernel-integration-test.sh's own header comment for the
    # full why - boots a REAL Linux kernel in QEMU against a real,
    # hand-built concatenated (compressed + padded + uncompressed)
    # initramfs, proving the encrypted-root kexec handoff's own
    # overwrite mechanism actually works the way the kernel unpacks it,
    # not just that boot-dataset.sh's own shell-level round-trip check
    # agrees with itself - that gap is exactly what let a real hardware
    # boot fail despite every other check passing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install qemu, cpio, busybox
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio busybox-static

      - name: Extract a kernel image (no real install - see the script's own comment)
        run: |
          set -e
          # A plain `apt-get install` of a kernel package on a CI
          # runner triggers an initramfs-tools/bootloader update for a
          # kernel that will never actually be booted here - `apt-get
          # download` + `dpkg -x` gets just the vmlinuz file, nothing
          # else touched on the runner.
          real_pkg="$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/{print $2; exit}')"
          if [ -z "$real_pkg" ]; then
              echo "ERROR: could not resolve linux-image-generic to a real versioned kernel-image package - apt-cache depends output:" >&2
              apt-cache depends linux-image-generic >&2
              exit 1
          fi
          apt-get download "$real_pkg"
          mkdir -p /tmp/kernel-extract
          dpkg -x "${real_pkg}"_*.deb /tmp/kernel-extract
          find /tmp/kernel-extract/boot -maxdepth 1 -name 'vmlinuz-*'

      - name: Run tests/kernel-integration-test.sh
        run: |
          set -e
          kernel="$(find /tmp/kernel-extract/boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -1)"
          KERNEL_IMAGE="$kernel" BUSYBOX_BIN="$(command -v busybox)" ./tests/kernel-integration-test.sh

  bios-iso-entry-test:
    # tests/bios-iso-entry-test.sh's own header comment for the full
    # why - boots the real El-Torito bios/stage-iso.bin in QEMU and
    # proves a non-NULL fat_read_range() progress callback survives ISO
    # entry, the regression guard for the %cs=SEG-at-entry bug this
    # session found and fixed (stage2_entry.S's own explicit far jump).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install xorriso, dosfstools, mtools, qemu
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xorriso dosfstools mtools qemu-system-x86

      - name: Run tests/bios-iso-entry-test.sh
        run: ./tests/bios-iso-entry-test.sh

  bios-iso-atapi-test:
    # Same real QEMU boot as bios-iso-entry-test, but forces
    # cdrom_disk.c's ATAPI backend (see that file's own comment on
    # ZFSBOOT_FORCE_ATAPI) - QEMU/SeaBIOS's INT13h normally succeeds, so
    # the plain bios-iso-entry-test job above never actually exercises
    # the ATAPI driver at all. Added after a full source audit found (and
    # this repo fixed) a real multi-phase-transfer buffer double-advance
    # bug in ata_atapi.c that only manifests past the first DRQ phase -
    # invisible to any test that never drives this backend for real.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install xorriso, dosfstools, mtools, qemu
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xorriso dosfstools mtools qemu-system-x86

      - name: Run tests/bios-iso-entry-test.sh (FORCE_ATAPI=1)
        run: FORCE_ATAPI=1 ./tests/bios-iso-entry-test.sh

  bios-hdd-entry-test:
    # tests/bios-hdd-entry-test.sh's own header comment for the full
    # why - boots the real raw-disk bios/stage1.bin + bios/stage2.bin as
    # a classic MBR hard disk in QEMU (-drive format=raw, NOT -cdrom),
    # the only automated coverage of disk.c's own disk_read_lba() and of
    # stage1.S's own STAGE2_MAGIC/retry logic - neither is exercised by
    # the ISO/El-Torito jobs above (those boot through cdrom_disk.c and
    # stage2_entry.S directly, with no stage1 of their own involved at
    # all). No xorriso needed here - this path never builds an ISO.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dosfstools, mtools, qemu
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools qemu-system-x86

      - name: Run tests/bios-hdd-entry-test.sh
        run: ./tests/bios-hdd-entry-test.sh

  ata-atapi-host-test:
    # bios/tests/ata_atapi_host_test.c - regression guard for the same
    # multi-phase-transfer double-advance bug bios-iso-atapi-test above
    # covers end-to-end, but at the exact arithmetic level (see that
    # test's own header comment) - proves the pointer/counter bookkeeping
    # across a scripted multi-phase sequence QEMU/SeaBIOS never produces.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run bios/tests/run-ata-atapi-host-test.sh
        run: ./bios/tests/run-ata-atapi-host-test.sh

  fat-host-test:
    # bios/tests/fat_host_test.c/build_fat_fixtures.py existed in the tree
    # (added earlier this session as the regression guard for a real
    # Floyd's-tortoise-and-hare FAT-table-cache thrashing bug fixed in
    # bios/fat.c) but a full source audit found they were wired into
    # NOTHING - no Makefile target, no Justfile recipe, no CI job, so the
    # regression guard only ever ran when a human happened to type a gcc
    # command by hand. This job (and the test-fat-host Justfile recipe it
    # calls) closes that gap.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run bios/tests/run-fat-host-test.sh
        run: ./bios/tests/run-fat-host-test.sh

  build-x86_64:
    # Same build.sh invocation release.yml uses for the real tag-
    # triggered release, run here on every push/PR instead so a break
    # in build.sh itself (or in the real Alpine container's own package
    # set drifting under it) is caught immediately - including build.sh's
    # own "verify the encrypted-root kexec handoff's own assumptions"
    # block, which can ONLY be exercised inside a real Alpine container
    # with real mkinitfs/zfs packages, not by tests/run-tests.sh at all.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # build.sh bakes this straight into the image at /boot/alpine-zfsboot
      # (see its own comment) and fails fast if it's missing - has to exist
      # before build.sh runs, same as release.yml's own build-x86_64 job
      # (there via downloading the build-tool job's artifact instead, since
      # release.yml stamps a real tag into it; CI has no tag to stamp, so a
      # plain local build with version.txt's own version - matching `just
      # build-tool`'s own convention - is enough here).
      - name: Build cmd/tool (x86_64)
        run: |
          set -e
          mkdir -p out
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$(cat version.txt)" -o out/alpine-zfsboot-x86_64 ./cmd/tool

      - name: Build EFI image (x86_64)
        run: |
          set -e
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e OUT_DIR=/work/out \
            alpine:$(cat alpine-version.txt) sh -c '
              set -eu
              apk update
              apk add --no-cache ca-certificates-bundle mkinitfs zfs zfs-lts linux-lts kexec-tools ncurses-terminfo-base xz dialog gnu-efi gnu-efi-dev gcc musl-dev make binutils python3 bash dropbear dropbear-dbclient xorriso dosfstools mtools sgdisk
              ./build.sh
            '
          ls -la out/

  build-aarch64:
    # Native runner, matching release.yml's own reasoning (see that
    # file's own comment) - run on every push/PR too, not only at
    # release time, since aarch64-specific build.sh assumptions (the
    # console-order/USB-HID module fixes, the arch-specific FEATURES=)
    # are exactly the kind of thing that regresses silently otherwise.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # See build-x86_64's own comment on why this has to run before
      # build.sh does.
      - name: Build cmd/tool (aarch64)
        run: |
          set -e
          mkdir -p out
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$(cat version.txt)" -o out/alpine-zfsboot-aarch64 ./cmd/tool

      - name: Build EFI image (aarch64)
        run: |
          set -e
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e OUT_DIR=/work/out \
            alpine:$(cat alpine-version.txt) sh -c '
              set -eu
              apk update
              apk add --no-cache ca-certificates-bundle mkinitfs zfs zfs-lts linux-lts kexec-tools ncurses-terminfo-base xz dialog gnu-efi gnu-efi-dev gcc musl-dev make binutils python3 bash dropbear dropbear-dbclient xorriso dosfstools mtools sgdisk
              ./build.sh
            '
          ls -la out/
