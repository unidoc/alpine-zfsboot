name: Build and release .EFI images

# Triggered by pushing a version tag (v0.1.0, v0.2.0, ...) - same
# pattern alpine-rescue's own release.yml uses. That tag versions this
# PROJECT (init/menu.py/build.sh - whatever changed since the last
# release), not the Alpine base it's built against - bump it on any
# change worth shipping, or whenever a new Alpine version needs
# supporting, entirely on our own schedule, no dependency on any other
# repo. Pushing a tag is a deliberate act, not automatic on every merge
# to main - these images get baked directly into installed systems'
# boot process with no PR/review gate in between. Asset filenames stay
# arch-based (unversioned) - only the release itself carries the tag -
# so `.../releases/latest/download/...` links never need to change
# when a new version ships.
on:
  push:
    tags:
      - "v*"

jobs:
  # Nothing else here compares the pushed tag against version.txt - the
  # Justfile's own release recipe does, but that guard lives only on
  # whoever's machine ran `just release`, and a tag can reach this
  # workflow other ways (a hand-run `git push origin vX.Y.Z`, the
  # documented recovery from a failed release build). Without this,
  # pushing v0.2.0 before merging its version.txt bump ships a release
  # called v0.2.0 containing a .EFI whose boot banner and kernel cmdline
  # still say the old version, and a cmd/tool binary reporting v0.2.0 -
  # two different versions in the same release, in the exact artifacts
  # an operator reads on screen. One job, so the check happens once
  # rather than duplicated in every build job.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag must match version.txt
        run: |
          set -e
          want="${GITHUB_REF_NAME#v}"
          got="$(tr -d '[:space:]' < version.txt)"
          [ "$got" = "$want" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match version.txt ($got)"
            exit 1
          }

  build-x86_64:
    # needs build-tool too, not just verify-version: build.sh bakes
    # cmd/tool's own binary straight into the image at /boot/alpine-zfsboot
    # (see build.sh's own comment there) and fails fast if it isn't already
    # sitting in out/ before build.sh runs - build-tool is the job that
    # produces it (with the real pushed tag stamped into --version, which a
    # second build here could not replicate), so its artifact has to land
    # in this job's own out/ first.
    needs: [verify-version, build-tool]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: alpine-zfsboot-tool
          path: out

      - name: Make downloaded cmd/tool binaries executable
        run: chmod +x out/alpine-zfsboot-x86_64 out/alpine-zfsboot-aarch64

      # No job-level `container:` - GitHub only bundles a Node runtime
      # for x64 Alpine containers, not arm64 (confirmed the hard way in
      # unidoc-aports' own CI), so this repo runs the Alpine side
      # inside a throwaway `docker run` container on both arches
      # uniformly instead of relying on that x64-only exception - one
      # pattern, not two.
      - name: Build EFI image (x86_64)
        run: |
          set -e
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e OUT_DIR=/work/out \
            alpine:$(cat alpine-version.txt) sh -c '
              set -eu
              apk update
              apk add --no-cache ca-certificates-bundle mkinitfs zfs zfs-lts linux-lts kexec-tools ncurses-terminfo-base xz dialog gnu-efi gnu-efi-dev gcc musl-dev make binutils python3 bash dropbear dropbear-dbclient xorriso dosfstools mtools sgdisk
              ./build.sh
            '
          # The container has no --user, so it runs as root inside
          # (apk add needs it) - every file build.sh writes to the
          # bind-mounted out/ comes out root-owned on the host. The
          # runner user actions/upload-artifact runs as next can't read
          # those, and fails with EACCES trying to zip them. Reclaim
          # ownership here, same fix already proven in unidoc-aports'
          # own CI for the identical container-writes-as-root pattern.
          sudo chown -R "$(id -u):$(id -g)" out/
          # Already published under the build-tool job's own
          # alpine-zfsboot-tool artifact (that's where these came from,
          # downloaded above) - build.sh only reads them, never removes
          # them, so left alone they'd upload here too and publish's own
          # merge-multiple download would just overwrite one copy with an
          # identical other. Not incorrect, just a redundant upload.
          rm -f out/alpine-zfsboot-x86_64 out/alpine-zfsboot-aarch64
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: efi-images-x86_64
          path: out/*
          if-no-files-found: error

  build-aarch64:
    # See build-x86_64's own comment on why build-tool is a real
    # dependency, not just verify-version.
    needs: [verify-version, build-tool]
    # Native runner, not QEMU - this repo's own build doesn't compile
    # anything (zfs-lts ships prebuilt kernel modules, objcopy/mkinitfs
    # just move bytes around), so QEMU emulation would probably be
    # tolerable here - but a native runner is simpler and removes the
    # question entirely rather than assuming it would be fine.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: alpine-zfsboot-tool
          path: out

      - name: Make downloaded cmd/tool binaries executable
        run: chmod +x out/alpine-zfsboot-x86_64 out/alpine-zfsboot-aarch64

      - name: Build EFI image (aarch64)
        run: |
          set -e
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e OUT_DIR=/work/out \
            alpine:$(cat alpine-version.txt) sh -c '
              set -eu
              apk update
              apk add --no-cache ca-certificates-bundle mkinitfs zfs zfs-lts linux-lts kexec-tools ncurses-terminfo-base xz dialog gnu-efi gnu-efi-dev gcc musl-dev make binutils python3 bash dropbear dropbear-dbclient xorriso dosfstools mtools sgdisk
              ./build.sh
            '
          # The container has no --user, so it runs as root inside
          # (apk add needs it) - every file build.sh writes to the
          # bind-mounted out/ comes out root-owned on the host. The
          # runner user actions/upload-artifact runs as next can't read
          # those, and fails with EACCES trying to zip them. Reclaim
          # ownership here, same fix already proven in unidoc-aports'
          # own CI for the identical container-writes-as-root pattern.
          sudo chown -R "$(id -u):$(id -g)" out/
          rm -f out/alpine-zfsboot-x86_64 out/alpine-zfsboot-aarch64
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: efi-images-aarch64
          path: out/*
          if-no-files-found: error

  build-tool:
    needs: verify-version
    # cmd/tool - the install-time version/update helper (see its own
    # header comment), entirely separate from the .EFI build above:
    # plain Go cross-compilation, no docker/Alpine container needed,
    # since it never touches mkinitfs/zfs/kexec-tools at all. One
    # runner builds both arches - Go's own cross-compilation (just
    # GOARCH=) needs neither QEMU nor a second native runner the way
    # the .EFI builds above do.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build alpine-zfsboot for x86_64 + aarch64
        run: |
          set -e
          mkdir -p out
          # -X main.version=... bakes the pushed tag into the binary's
          # own `--version` flag (see cmd/tool/main.go) - a local
          # `go build`/`just build-tool` has no tag to attribute
          # itself to, so it keeps the "dev" default instead.
          # CGO_ENABLED=0 explicitly on BOTH - amd64 is this runner's
          # own native arch, so without this it silently cgo-links
          # against the runner's glibc (confirmed: `file` on the
          # resulting binary shows a real dynamic ELF interpreter,
          # /lib64/ld-linux-x86-64.so.2) instead of coming out static.
          # A target running this on musl-based Alpine (every real
          # target this binary is for) would fail outright. arm64 is
          # cross-compiled here, which already disables cgo by
          # default (no cross C toolchain available) - static either
          # way - but setting this on both makes that not an accident
          # of which arch happens to match the runner.
          # $GITHUB_REF_NAME (an env var this runner already sets, read
          # inside the shell), NOT a literal dollar-double-brace
          # github.ref_name interpolation into this script - a full
          # source audit found this was the one template-injection
          # sink across all four workflows in this project. GitHub
          # expands double-curly-brace expressions textually into the
          # script BEFORE bash ever sees it (even inside a comment -
          # confirmed the hard way: writing the literal syntax in
          # these two lines made the whole workflow file fail to
          # parse, "unexpected end of input ... [expression]" - the
          # exact reason this comment is now worded around it), and
          # `git check-ref-format` permits `` ` ``, $, ", ;, &, |, (, )
          # in a tag name (it only bans space/control chars/~^:?*[\ and
          # a few structural patterns) - a tag like
          # `v0.1.1"; curl ...|sh; #` pushed to this repo would execute
          # arbitrary commands inside this job. verify-version, earlier
          # in this same file, already does this correctly
          # (`want="${GITHUB_REF_NAME#v}"`) - matching that pattern here
          # closes the gap. The precondition is real but narrow: pushing
          # a tag requires write access to this repo already, so this
          # is a hardening fix, not a fork-PR-exploitable one.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$GITHUB_REF_NAME" -o out/alpine-zfsboot-x86_64 ./cmd/tool
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$GITHUB_REF_NAME" -o out/alpine-zfsboot-aarch64 ./cmd/tool
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: alpine-zfsboot-tool
          path: out/*
          if-no-files-found: error

  # publish is the ONLY job in this whole workflow that runs under the
  # "signing" GitHub Environment, and therefore the only one that can
  # ever see ALPINE_ZFSBOOT_PRIVATE_KEY at all (issue #2, unidoc-alip's
  # PR #1 review: "the real answer is detached-signature verification
  # with a key that does not live on GitHub" - narrowed, after real
  # design discussion, to "does not live in a plain repository secret
  # or an ordinary build/PR job's reach" - see internal/release/
  # signature.go's own comment on the exact threat model this
  # protects against and the one it deliberately does not: a GitHub
  # Environment secret still lives on GitHub, gated by that
  # Environment's own protection rules, not physically offline). Same
  # "signing" environment name and ALPINE_ZFSBOOT_PRIVATE_KEY/
  # ABUILD_PRIVATE_KEY naming convention unidoc-aports' own
  # build-and-publish.yml already established for this exact pattern -
  # see that file's own comment on why an Environment secret (Admin-
  # only to create/overwrite) beats a plain repository secret
  # (anyone with Write access can touch it - a real, separate risk
  # from branch protection, since overwriting a secret isn't a git
  # push and master's own PR+review requirement never sees it).
  # build-x86_64/build-aarch64/build-tool above run with NO environment
  # at all and never touch this secret, by construction, not by
  # convention - a compromised dependency or a malicious PR reaching
  # one of THOSE jobs still cannot exfiltrate the signing key, because
  # it is never in scope there to begin with.
  #
  # Required Environment setup on GitHub (one-time, done in the repo's
  # own Settings -> Environments, not in this file):
  #   1. Create an environment named exactly "signing".
  #   2. Add ALPINE_ZFSBOOT_PRIVATE_KEY as an ENVIRONMENT secret under
  #      it (Settings -> Environments -> signing -> Environment
  #      secrets) - NOT a repository-level secret. Its value is the raw
  #      content of minisign -G's own generated secret-key file
  #      (alpine-zfsboot.key), byte for byte.
  #   3. Protection rules on that environment are REQUIRED, not
  #      optional (PR #10 review, F1 - an earlier version of this
  #      comment called this step optional, which was wrong: with no
  #      deployment_branch_policy, GitHub releases an Environment's
  #      secrets to a job running from ANY ref, so "build jobs don't
  #      declare environment: signing" is a property of this file, not
  #      of the repository - a Write-access collaborator can push a
  #      branch or open a same-repo PR whose workflow adds
  #      `environment: signing` to any job and reads the secret; no
  #      Admin needed, no review gate, since branch rulesets only cover
  #      master/main/dev). Settings -> Environments -> signing ->
  #      Deployment branches and tags -> Selected branches and tags,
  #      add ONLY the tag rule `v*` (no branches) - AND add a tag
  #      ruleset restricting creation/update/deletion of `refs/tags/v*`
  #      to maintainers/admins, or rule 1 alone is bypassed by pushing
  #      a `v*` tag at a commit with a modified release.yml. A required
  #      reviewer on the environment is optional on top of that - the
  #      closest this setup gets to issue #2's original "key that does
  #      not live on GitHub" without moving signing fully offline.
  #      Remaining exposure once both are in place: org/repo admins,
  #      and anyone who can create a `refs/tags/v*` ref.
  #
  # Fails closed by construction, not by a special check: every step
  # below runs under `set -e` (bash's own default failure propagation
  # plus this workflow's own steps having no `|| true`/continue-on-
  # error anywhere in this job) - a single asset that fails to sign
  # aborts the whole job before the "Create GitHub release" step ever
  # runs, so there is no code path that publishes a release with some
  # assets signed and others silently not.
  publish:
    needs: [build-x86_64, build-aarch64, build-tool]
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
    steps:
      # Only for the release body's own "Built on Alpine X.Y" line below -
      # everything that actually builds anything already read
      # alpine-version.txt in its own job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            alpine-version.txt
          sparse-checkout-cone-mode: false

      - name: Read alpine-version.txt
        run: echo "ALPINE_VERSION=$(cat alpine-version.txt)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd out
          sha256sum * | tee SHA256SUMS

      # A pinned, checksum-verified static build of the real upstream
      # minisign CLI - the release-side SIGNING tool this whole design
      # deliberately keeps out of alpine-zfsboot's own production
      # binary (internal/minisign is verify-only, no os/exec - see
      # that package's own doc comment). Pinned to a specific version +
      # a real, independently-recorded SHA256 (not "whatever the tag
      # currently resolves to") so a compromised or replaced upstream
      # release asset can't silently swap in a different signing tool
      # here - the exact same supply-chain posture this workflow
      # already applies to every alpine-zfsboot release asset it
      # produces itself, turned around onto a tool it depends on.
      - name: Install minisign (signing tool, pinned + checksum-verified)
        run: |
          set -e
          curl -fsSL -o /tmp/minisign.tar.gz \
            "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/minisign.tar.gz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v

      # The ONLY step in this whole workflow with
      # ALPINE_ZFSBOOT_PRIVATE_KEY in scope - reconstructs the real
      # minisign secret-key file from the environment secret into a
      # runner-local temp file, signs every release asset with it, then
      # deletes it immediately (defense in depth - the runner itself is
      # destroyed after this job regardless, but the key file should
      # not linger on disk any longer than the one command that needs
      # it). Never echoed, never written to a location
      # `actions/upload-artifact` or any later step could pick up -
      # out/*.minisig (the PUBLIC output of signing) is the only thing
      # that leaves this step.
      #
      # -W (no password) at key-generation time is what makes this
      # step able to sign non-interactively at all - minisign -S
      # otherwise prompts for the secret key's own password on stdin,
      # which a CI job has no human present to answer. The
      # Environment's own access controls (secret scoping + protection
      # rules, see this job's own top comment) are the real boundary
      # here, not a second password on top of them.
      #
      # Every asset in out/ gets signed except SHA256SUMS itself -
      # deliberately: SHA256SUMS is superseded by per-file signatures
      # now (see internal/release/signature.go's own comment on why a
      # same-origin checksum alone was never real defense), kept only
      # for tooling that still wants a plain checksum manifest, not
      # something worth a signature of its own on top of what every
      # individual file already carries.
      - name: Sign every release asset (ALPINE_ZFSBOOT_PRIVATE_KEY, signing environment only)
        env:
          ALPINE_ZFSBOOT_PRIVATE_KEY: ${{ secrets.ALPINE_ZFSBOOT_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "${ALPINE_ZFSBOOT_PRIVATE_KEY}" ]; then
            echo "::error::ALPINE_ZFSBOOT_PRIVATE_KEY is empty - see this workflow's own comment on configuring it as a 'signing' Environment secret. Refusing to publish an unsigned release."
            exit 1
          fi
          keyfile="$(mktemp)"
          printf '%s' "${ALPINE_ZFSBOOT_PRIVATE_KEY}" > "${keyfile}"
          trap 'rm -f "${keyfile}"' EXIT

          cd out
          for f in *; do
            case "${f}" in
              SHA256SUMS|*.minisig) continue ;;
            esac
            minisign -S -s "${keyfile}" -x "${f}.minisig" \
              -t "alpine-zfsboot ${GITHUB_REF_NAME} - ${f}" -m "${f}"
          done
          ls -la

      # PR #10 review, F3: nothing previously checked that
      # ALPINE_ZFSBOOT_PRIVATE_KEY actually matches the public key
      # embedded in internal/release/signature.go
      # (trustedSigningKeys). If the Environment secret ever held a
      # different key (a regenerated pair, a paste of the wrong file),
      # the step above would still succeed - minisign -S doesn't know
      # what any consumer expects - and publish a release that every
      # real `check`/`install`/`update` then refuses, discovered only
      # after the fact, with no fix but a new tag. Verifying here, under
      # the same `set -e`, turns that into a failed job before "Create
      # GitHub release" ever runs.
      #
      # The public key below is duplicated from signature.go on
      # purpose - there is no third place for both to import from - so
      # this step fails loudly the moment the two copies ever drift,
      # rather than silently signing with a key nothing actually
      # trusts.
      - name: Verify signatures against the embedded public key
        run: |
          set -e
          pub='RWRYhfIlgmx/lNEckpNnD/XZl8FjxPfsHqwd3aeEwER3Yb/Cw4ZRLF8g'
          cd out
          for f in *; do
            case "${f}" in SHA256SUMS|*.minisig) continue ;; esac
            minisign -V -q -P "${pub}" -m "${f}" -x "${f}.minisig"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: alpine-zfsboot ${{ github.ref_name }}
          body: "Built on Alpine ${{ env.ALPINE_VERSION }}. A self-contained Alpine Linux ZFS bootloader, installer, and remote recovery environment for BIOS and UEFI systems. For each of x86_64/aarch64: .EFI, .iso, and loose vmlinuz/initramfs.img/cmdline.txt (GRUB chainload, and the BIOS FAT payload) - both consoles active, switch live from the menu. Also included: the legacy BIOS boot code (x86_64 only, GPT and MBR partition tables both supported by the same stage1/stage2 files - both read the same FAT/ESP partition UEFI mode uses) and alpine-zfsboot-x86_64/alpine-zfsboot-aarch64 (cmd/tool - the install-time version/update helper). SHA256SUMS covers every asset here; every asset also carries its own detached minisign .minisig signature, verified in-process by alpine-zfsboot's own install/update before any boot-path write (see internal/minisign in the source tree)."
          generate_release_notes: true
          files: |
            out/*
          fail_on_unmatched_files: true
